name: Build guides index

# Regenerates the guides list on the landing page from repositories tagged with
# the topic `mixomics-guide` that have Pages enabled.
#
# Triggers, in order of how you will actually use them:
#
#   repository_dispatch — INSTANT. The intended path when publishing a guide:
#       gh api repos/mixOmics-org/mixomics-org.github.io/dispatches \
#         -f event_type=guide-published
#
#   workflow_dispatch   — on demand, from the Actions tab or:
#       gh workflow run build-index.yml -R mixOmics-org/mixomics-org.github.io
#
#   schedule            — hourly safety net, so a forgotten dispatch costs at
#                         most an hour rather than a day
#
#   push                — when the generator or this workflow changes
#
# Why :17 and not :00 — GitHub delays scheduled runs during high load, and the
# top of the hour is the peak. Their own guidance is to pick a different minute.
# Scheduled workflows are free on public repositories, and the job exits without
# committing when nothing changed, so an hourly cadence costs nothing and adds
# no commit noise.
#
# Note: GitHub disables scheduled workflows in a repository with no activity for
# 60 days. Not a concern while the site is being worked on; worth knowing if it
# ever goes quiet.

on:
  schedule:
    - cron: "17 * * * *"       # hourly at :17 — see the note above on :00
  workflow_dispatch:
  repository_dispatch:
    types: [guide-published]
  push:
    paths:
      - "scripts/build-index.py"
      - "build-index.py"
      - ".github/workflows/build-index.yml"

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate guides list
        env:
          # default GITHUB_TOKEN can read this org's public repos
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: mixOmics-org
          TOPIC: mixomics-guide
        run: |
          # tolerate the script living in the repo root or in scripts/
          if   [ -f scripts/build-index.py ]; then python3 scripts/build-index.py
          elif [ -f build-index.py ];         then python3 build-index.py
          else echo "::error::build-index.py not found"; exit 1
          fi

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html sitemap.xml humans.txt; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml humans.txt
          git commit -m "chore(index): regenerate guides list, sitemap and humans.txt"
          git push
